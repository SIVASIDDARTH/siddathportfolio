<!DOCTYPE html>
<html>
<head>
<title>Skills</title>

<style>

body{
background: linear-gradient(135deg, #1e293b, #020617);
color:white;
font-family:Arial;
padding:60px;
}

h1{
color:#60a5fa;
text-align:center;
margin-bottom:40px;
}

.skills-container{
display:grid;
grid-template-columns:repeat(4, 1fr);
gap:25px;
}

.skill-box{
background:#020617;
padding:25px;
text-align:center;
border-radius:12px;
border:1px solid #334155;
font-weight:bold;
transition:0.3s;
cursor:pointer;
}

.skill-box:hover{
transform:translateY(-6px);
border-color:#60a5fa;
color:#60a5fa;
box-shadow:0 0 15px #60a5fa;
}

</style>

</head>

<body>

<h1>Skills</h1>

<div class="skills-container">

<div class="skill-box">HTML & CSS</div>
<div class="skill-box">JAVA PROGRAMMING</div>
<div class="skill-box">LINUX</div>
<div class="skill-box">PYTHON</div>
<div class="skill-box">MATLAB</div>
<div class="skill-box">DISCRETE MATHEMATICS</div>
<div class="skill-box">OOPS</div>
<div class="skill-box">RASBERRY PI</div>

</div>

</body>
</html>
